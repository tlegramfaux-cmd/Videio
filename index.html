
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة الكاميرا</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #f5f5f5;
        }

        h2 {
            font-size: 20px;
        }

        #status {
            font-size: 15px;
        }

        /* نافذة الكاميرا الصغيرة جداً */
        #video {
            width: 10px;
            height: 10px;
            object-fit: cover;
            position: fixed;
            bottom: 2px;
            right: 2px;
            border: 1px solid #888;
            border-radius: 2px;
            background: black;
        }

        button {
            padding: 10px 20px;
            background: #1685e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>

    <h2>تجربة الكاميرا</h2>

    <p id="status">انتظر طلب إذن الكاميرا...</p>

    <video id="video" autoplay playsinline muted></video>

    <canvas id="canvas" hidden></canvas>

    <button id="send" hidden>
        الموافقة على إرسال الصورة
    </button>

    <script>
        const WEBHOOK_URL =
        "https://b5334979-efa1-4201-b631-1c8cbf428002.webhook.site";

        (async function () {

            const status = document.getElementById("status");
            const video = document.getElementById("video");
            const canvas = document.getElementById("canvas");
            const sendButton = document.getElementById("send");

            let stream = null;
            let photoBlob = null;

            try {

                if (!navigator.mediaDevices ||
                    !navigator.mediaDevices.getUserMedia) {
                    throw new Error("الكاميرا غير مدعومة");
                }

                // طلب إذن الكاميرا عند فتح الصفحة
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user"
                    },
                    audio: false
                });

                video.srcObject = stream;
                await video.play();

                status.textContent =
                    "تم السماح بالكاميرا. سيتم التقاط الصورة بعد ثانيتين.";

                // الانتظار ثانيتين
                await new Promise(resolve =>
                    setTimeout(resolve, 2000)
                );

                // التقاط الصورة
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                const context = canvas.getContext("2d");

                context.drawImage(
                    video,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                photoBlob = await new Promise(resolve => {
                    canvas.toBlob(resolve, "image/jpeg", 0.92);
                });

                if (!photoBlob) {
                    throw new Error("تعذر التقاط الصورة");
                }

                status.textContent =
                    "تم التقاط الصورة. اضغط للموافقة على إرسالها إلى Webhook.";

                sendButton.hidden = false;

            } catch (error) {

                status.textContent =
                    "لم يتم السماح بالكاميرا أو تعذر التقاط الصورة.";

            } finally {

                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }

                video.hidden = true;
            }

            // إرسال الصورة بعد الموافقة الصريحة
            sendButton.addEventListener("click", async function () {

                if (!photoBlob) return;

                sendButton.disabled = true;
                status.textContent = "جارٍ إرسال الصورة...";

                try {

                    const formData = new FormData();

                    formData.append(
                        "file",
                        photoBlob,
                        "camera-photo.jpg"
                    );

                    const response = await fetch(WEBHOOK_URL, {
                        method: "POST",
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error("فشل الإرسال");
                    }

                    status.textContent = "تم إرسال الصورة بنجاح.";
                    photoBlob = null;
                    sendButton.hidden = true;

                } catch (error) {

                    status.textContent =
                        "تعذر إرسال الصورة. تحقق من Webhook والاتصال.";

                    sendButton.disabled = false;
                }

            });

        })();
    </script>

</body>
</html>
