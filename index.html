<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تجربة الكاميرا</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px;
}
video, img {
  width: 100%;
  max-width: 400px;
  border-radius: 12px;
}
</style>
</head>
<body>

<h2>تجربة الكاميرا</h2>
<p id="status">انتظر طلب إذن الكاميرا...</p>

<video id="video" autoplay playsinline muted hidden></video>
<canvas id="canvas" hidden></canvas>
<img id="photo" hidden alt="الصورة الملتقطة">

<a id="download" hidden download="photo.jpg">تنزيل الصورة</a>

<script>
(async function () {
  const status = document.getElementById("status");
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const photo = document.getElementById("photo");
  const download = document.getElementById("download");

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    video.srcObject = stream;
    video.hidden = false;

    await video.play();

    status.textContent = "تم السماح بالكاميرا. التقاط الصورة بعد ثانيتين...";

    await new Promise(resolve => setTimeout(resolve, 2000));

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    canvas.getContext("2d").drawImage(
      video, 0, 0, canvas.width, canvas.height
    );

    const blob = await new Promise(resolve =>
      canvas.toBlob(resolve, "image/jpeg", 0.92)
    );

    if (!blob) throw new Error("تعذر التقاط الصورة");

    const imageURL = URL.createObjectURL(blob);

    photo.src = imageURL;
    photo.hidden = false;

    download.href = imageURL;
    download.hidden = false;

    status.textContent = "تم التقاط الصورة بنجاح.";

    stream.getTracks().forEach(track => track.stop());
    video.hidden = true;

  } catch (error) {
    status.textContent =
      "لم يتم السماح بالكاميرا أو تعذر تشغيلها. لم تُلتقط أي صورة.";
  }
})();
</script>

</body>
</html>
